[project]
name = "stratified-models"
version = "0.2.0"
description = "Composable Laplacian regularized stratified regression and classification with replayable data sources"
readme = "README.md"
authors = [{ name = "Tom Shlomo" }]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "attrs>=25.4.0",
    "jax>=0.9.0,<0.10",
    "numpy>=2.4.1,<3",
    "scipy>=1.17.0,<2",
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.0"]
polars = ["polars>=1.30"]
parquet = ["pyarrow>=20"]
sklearn = ["scikit-learn>=1.8.0"]
tuning = ["optuna>=4.7.0"]
cvxpy = ["cvxpy>=1.7.5"]
notebooks = [
    "marimo>=0.19.6,<0.20",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "pandas>=3.0.0",
    "scikit-learn>=1.8.0",
    "openpyxl>=3.1.5",
]
common = ["stratified-models[pandas,polars,parquet,sklearn,tuning,cvxpy,notebooks]"]

[build-system]
requires = ["uv_build>=0.9.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.13", "ty>=0.0.13"]

[tool.ruff]
extend-exclude = ["legacy", "examples"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ANN"]

[tool.ty.src]
include = ["src"]
exclude = ["legacy", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["legacy", ".venv"]
markers = [
    "integration: checks installed extras and end-to-end workflows",
    "slow: full reproduction or resource measurements",
]
